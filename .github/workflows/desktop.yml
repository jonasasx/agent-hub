# Desktop installers (change desktop-platforms): Windows (NSIS), Linux (AppImage), macOS (dmg, ad-hoc signature).
# A `desktop-v<version>` tag publishes the immutable GitHub release the hub image downloads (scripts/fetch-desktop-release.mjs).
name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: win
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
          - os: macos-latest
            script: dist:mac
            artifact: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w shared
      - run: npm run ${{ matrix.script }} -w desktop
        env:
          # No Apple certificate: the dmg gets an ad-hoc signature (electron-builder.yml, mac.identity "-").
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke start of the AppImage under xvfb
        if: matrix.artifact == 'linux'
        working-directory: desktop/release
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2 libgtk-3-0 libnss3 libasound2t64
          chmod +x Agent-Hub-*.AppImage
          # Still running after 20 s (timeout exit code 124) means the app started and did not crash.
          code=0
          timeout 20 xvfb-run -a ./Agent-Hub-*.AppImage --appimage-extract-and-run --no-sandbox || code=$?
          echo "exit code: $code"
          test "$code" = 124
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            desktop/release/Agent-Hub-Setup-*.exe
            desktop/release/Agent-Hub-Setup-*.exe.blockmap
            desktop/release/Agent-Hub-*.AppImage
            desktop/release/Agent-Hub-*.dmg
            desktop/release/latest.yml
            desktop/release/latest-linux.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true
      - name: Tag matches desktop/package.json
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          test "${GITHUB_REF_NAME}" = "desktop-v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Every file of the feed is present
        working-directory: artifacts
        run: |
          ls -l
          for f in "Agent-Hub-Setup-${VERSION}.exe" "Agent-Hub-Setup-${VERSION}.exe.blockmap" "Agent-Hub-${VERSION}.AppImage" \
            "Agent-Hub-${VERSION}.dmg" latest.yml latest-linux.yml; do
            test -f "$f"
          done
      - name: Create the release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Agent Hub desktop ${VERSION}" \
            --notes "Desktop installers for Windows, Linux and macOS." \
            "Agent-Hub-Setup-${VERSION}.exe" "Agent-Hub-Setup-${VERSION}.exe.blockmap" "Agent-Hub-${VERSION}.AppImage" \
            "Agent-Hub-${VERSION}.dmg" latest-linux.yml latest.yml
